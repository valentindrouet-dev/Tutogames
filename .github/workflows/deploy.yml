# Construit l'application et la publie sur GitHub Pages.
#
# Sans ce workflow, Pages sert la racine du dépôt, donc l'index.html de
# développement qui pointe vers /src/main.tsx : un fichier TypeScript que le
# navigateur ne sait pas exécuter, d'où une page blanche. Seul le contenu de
# dist/, produit par Vite, doit être publié.

name: Déployer sur GitHub Pages

on:
  push:
    branches: [claude/board-game-tutorial-app-di0kt0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on laisse finir celle en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire
        run: npm run build

      - name: Configurer Pages
        # enablement bascule la source de Pages sur « GitHub Actions »,
        # au lieu du déploiement depuis une branche.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Téléverser dist/
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
